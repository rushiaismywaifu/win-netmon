name: Build Windows exe

# 打包 WinNetMon.exe（PyInstaller，單檔、視窗模式、需系統管理員權限）。
# 三種觸發方式：
#   1. push main            —— 每次合併後產一份 artifact，確認 exe 打得開來得回
#   2. 手動（workflow_dispatch）
#   3. 被 release.yml 以 workflow_call 呼叫（tag 推送時產出正式檔案）
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "tests/**"
  workflow_dispatch:
    inputs:
      python-version:
        description: 用來打包的 Python 版本
        type: string
        required: false
        default: "3.13"
  workflow_call:
    inputs:
      python-version:
        description: 用來打包的 Python 版本
        type: string
        required: false
        default: "3.13"

permissions:
  contents: read

env:
  # Windows runner 的 console 預設是 cp1252，中文輸出會壞掉
  PYTHONIOENCODING: utf-8

concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: PyInstaller（windows-latest / x64）
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version || '3.13' }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安裝相依套件 + PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: 產生 exe 版本資訊（version_info.txt）
        run: python tools/version.py pyinstaller-version --out version_info.txt

      - name: 打包（參數與 build_exe.bat 一致）
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --uac-admin `
            --name WinNetMon `
            --version-file version_info.txt `
            --collect-submodules scapy `
            --collect-all pydivert `
            main.py

      - name: 驗證產物 + 計算 SHA256
        shell: pwsh
        run: |
          $exe = "dist\WinNetMon.exe"
          if (-not (Test-Path $exe)) { throw "PyInstaller 沒有產出 $exe" }
          $item = Get-Item $exe
          if ($item.Length -lt 5MB) { throw "exe 太小（$($item.Length) bytes），可能打包失敗" }
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  WinNetMon.exe" | Set-Content -Encoding ascii "dist\WinNetMon.exe.sha256"
          Write-Host "產物：$($item.FullName) $([math]::Round($item.Length / 1MB, 2)) MB"
          Write-Host "SHA256：$hash"

      - name: 上傳 artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinNetMon-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/WinNetMon.exe
            dist/WinNetMon.exe.sha256
            README.md
